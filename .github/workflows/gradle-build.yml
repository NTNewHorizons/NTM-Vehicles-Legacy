name: Build bridge

on:
  workflow_call:
    secrets:
      IVL_READ_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require private dependency access
        env:
          IVL_READ_TOKEN: ${{ secrets.IVL_READ_TOKEN }}
        run: |
          test -n "$IVL_READ_TOKEN" || {
            echo 'Configure IVL_READ_TOKEN with read-only access to THOMASS47/IVL. Fork PRs cannot access this secret.' >&2
            exit 1
          }
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            17
            25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and run regression tests
        env:
          IVL_READ_TOKEN: ${{ secrets.IVL_READ_TOKEN }}
        run: |
          python3 -m unittest discover -s scripts/tests
          bash gradlew --no-daemon build
      - name: Upload bridge artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bridge
          path: build/libs/*.jar
          if-no-files-found: error
