name: Release

on:
  push:
    tags: ['*-1.7.10', 'v*-1.7.10']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: zulu
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/validate-release-tag.sh "$RELEASE_TAG"
      - name: Build pinned dependencies, test, and package
        run: bash ./gradlew --no-daemon build
      - name: Stage release artifacts
        run: |
          mkdir -p build/release
          version=$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          cp "build/libs/ntm_vehicles-$version.jar" "build/libs/ntm_vehicles-$version-sources.jar" build/release/
          (cd build/release && sha256sum *.jar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: build/release/
          if-no-files-found: error
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes
