plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

group = root_package
version = mod_version
base.archivesName.set(mod_id)

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.AZUL)
    }
    withSourcesJar()
}

minecraft {
    mcVersion.set('1.7.10')
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('12')
    username.set(minecraft_username)
}

repositories {
    mavenCentral()
    maven { url 'https://maven.minecraftforge.net/' }
    maven { url 'https://nexus.gtnewhorizons.com/repository/public/' }
    maven {
        url 'https://maven.ntmr.dev/releases/'
        content { includeGroup 'com.hbm' }
    }
}

// Build the pinned, dispatcher-patched IVL revision unless explicitly overridden.
def ivlJar = file(providers.gradleProperty('ivlJar').getOrElse(
    '.dependencies/IVL/build/libs/immersivevehicleslegacy-0.1.0-ntmv2-dev.jar'))
def ntmJar = providers.gradleProperty('ntmJar')

tasks.register('prepareIvl', Exec) {
    onlyIf { !providers.gradleProperty('ivlJar').isPresent() }
    inputs.files('scripts/prepare-dependencies.sh', 'patches/ivl-custom-hit-once.patch')
    outputs.file(ivlJar)
    outputs.file('.dependencies/IVL/build/libs/immersivevehicleslegacy-0.1.0-ntmv2.jar')
    commandLine 'bash', file('scripts/prepare-dependencies.sh')
}

dependencies {
    implementation files(ivlJar).builtBy(tasks.named('prepareIvl'))
    if (ntmJar.isPresent()) {
        implementation files(file(ntmJar.get()))
    } else {
        implementation('com.hbm:HBM-NTM:1.0.27_X5808:dev') { transitive = false }
    }
    // Runtime support without embedding either mod in the bridge.
    runtimeOnly 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    runtimeOnly 'org.jcraft:jorbis:0.0.17'
    runtimeOnly('com.github.GTNewHorizons:NotEnoughItems:2.8.158-GTNH:dev') { transitive = false }
    runtimeOnly('com.github.GTNewHorizons:CodeChickenCore:1.4.22:dev') { transitive = false }
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-inline:4.11.0'
}

tasks.register('verifyLocalDependencies') {
    dependsOn 'prepareIvl'
    inputs.file(ivlJar)
    doLast {
        def localJars = [ivlJar]
        if (ntmJar.isPresent()) { localJars.add(file(ntmJar.get())) }
        localJars.each { dependency ->
            if (!dependency.isFile()) {
                throw new GradleException("Missing development dependency: ${dependency}. See README.md for build instructions.")
            }
        }
    }
}
tasks.named('compileJava') { dependsOn 'verifyLocalDependencies' }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('processResources') {
    inputs.property 'mod_version', project.version
    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand(mod_id: mod_id, mod_name: mod_name, mod_version: project.version,
            mod_description: mod_description, mod_authors: mod_authors,
            mod_credits: mod_credits, mod_url: mod_url,
            mod_update_json: mod_update_json, mod_logo_path: mod_logo_path)
    }
    // The upstream mixin configuration is empty; no coremod is needed for this bridge.
    exclude 'mixins.ntm_vehicles.json'
}

tasks.named('injectTags') {
    outputClassName.set('io.github.techtastic.ntm_vehicles.ntm_vehicles.Tags')
    tags.set(['MOD_ID': mod_id, 'MOD_NAME': mod_name, 'VERSION': project.version.toString()])
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = mod_id
            artifact(tasks.named('reobfJar'))
            artifact(tasks.named('sourcesJar'))
        }
    }
}

apply from: 'gradle/scripts/publishing.gradle'

tasks.named('publish') {
    doFirst {
        if (publishing.repositories.isEmpty()) {
            throw new GradleException('No Maven destination. Set -Ppublish_to_maven=true -Pmaven_url=... or use publishToMavenLocal.')
        }
    }
}
