// Builds the pinned patched IVL checkout used only for local development.
// The bridge jar bundles neither IVL nor HBM.
def ivlJar = file('.dependencies/IVL/build/libs/immersivevehicleslegacy-0.1.0-ntmv2-dev.jar')
tasks.register('prepareIvl', Exec) {
    inputs.files('scripts/prepare-dependencies.sh', 'patches/ivl-custom-hit-once.patch')
    outputs.file(ivlJar)
    commandLine 'bash', file('scripts/prepare-dependencies.sh')
}
